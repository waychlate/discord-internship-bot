# Keyword-search APIs. Keys go in .env (ADZUNA_APP_ID/ADZUNA_APP_KEY, USAJOBS_API_KEY/USAJOBS_EMAIL);
# a source with no keys is skipped. Results still pass the filter above and the max_age_days cap.
keyword_search:
  queries:
    - "electrical engineering intern"
    - "computer engineering intern"
    - "firmware intern"
    - "embedded intern"
    - "hardware engineer intern"
    - "FPGA intern"
    - "ASIC intern"
    - "software engineering intern"
    - "student trainee engineering"

# Alert when text mentioning `keyword` on a page changes (first run records a baseline silently)
page_watchers:
  - name: "NVIDIA Ignite"
    company: "NVIDIA"
    url: "https://www.nvidia.com/en-us/about-nvidia/careers/university-recruiting/"
    keyword: "ignite"
